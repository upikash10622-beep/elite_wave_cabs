name: elite_wave_cabs
description: An Elite Wave Cabs Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  flutter_stripe: 14.0.0
     
  http: ^1.5.0
  dio: ^5.4.0

  google_maps_flutter: ^2.18.0
  google_places_flutter: ^2.1.0
  geolocator: ^14.0.3
  geolocator_android: ^5.0.2
  flutter_polyline_points: ^3.0.1

  provider: ^6.1.1
  intl: ^0.20.3
  pin_code_fields: ^9.4.0

  flutter_native_splash: ^2.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.jpg
    - assets/images/local_car.jpeg
    - assets/images/outstation_car.jpeg
    
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/splash_logo.jpg
  branding: assets/images/splash_logo.jpg
  color_dark: "#FFFFFF"
  image_dark: assets/images/splash_logo.jpg
  android: true
  ios: true